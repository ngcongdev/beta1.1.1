name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Patch Missing Headers & Setup Valid Strings
        run: |
          INCLUDE_DIR="build_headers/sys"
          mkdir -p "$INCLUDE_DIR"
          cat << 'EOF' > "$INCLUDE_DIR/fileport.h"
          #ifndef FILEPORT_H
          #define FILEPORT_H
          #include <sys/cdefs.h>
          #include <mach/mach.h>
          typedef mach_port_t fileport_t;
          #define FILEPORT_NULL MACH_PORT_NULL
          int fileport_makeport(int fd, fileport_t *port);
          int fileport_makefd(fileport_t port);
          #endif
          EOF

          find . -name "*.strings" | while read -r file; do
            echo '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>COMMON.DEVICE</key><string>THIẾT BỊ</string><key>dashboard.hardware_model</key><string>Mẫu máy</string><key>settings.ios_version</key><string>Phiên bản iOS</string><key>settings.compatibility</key><string>Tương thích</string><key>settings.supported</key><string>Được hỗ trợ</string><key>settings.supported_range_summary</key><string>Hỗ trợ iOS 15.0 - 16.7.10</string><key>DASHBOARD.FEATURES</key><string>TÍNH NĂNG</string><key>tab.cleaner</key><string>Dọn dẹp rác</string><key>tab.wallpapers</key><string>Hình nền</string><key>dashboard.features_footer</key><string>Các công cụ tối ưu hệ thống</string><key>DASHBOARD.INSTALLATION</key><string>CÀI ĐẶT</string><key>dashboard.enterprise_signing</key><string>Chứng chỉ doanh nghiệp</string><key>tab.home</key><string>Trang chủ</string><key>tab.files</key><string>Tệp tin</string><key>tab.patches</key><string>Bản vá</string></dict></plist>' > "$file.plist"
            plutil -convert binary1 "$file.plist" -o "$file"
            rm -f "$file.plist"
          done

          PROJ_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          ruby -r xcodeproj -e "
            proj = Xcodeproj::Project.open('$PROJ_FILE')
            proj.recreate_user_schemes
            proj.targets.each do |target|
              Xcodeproj::XCScheme.share_scheme(proj.path, target.name)
            end
            proj.save
          "

      - name: Build App
        run: |
          PROJ_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          SCHEME=$(xcodebuild -list -project "$PROJ_FILE" | awk '/Schemes:/{flag=1;next}/Build Configurations:/{flag=0}flag' | xargs | awk '{print $1}')

          xcodebuild -project "$PROJ_FILE" \
                     -scheme "$SCHEME" \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     GCC_WARN_INHIBIT_ALL_WARNINGS=YES \
                     USER_HEADER_SEARCH_PATHS="$(pwd)/build_headers" \
                     HEADER_SEARCH_PATHS="$(pwd)/build_headers" \
                     OTHER_LDFLAGS="-undefined dynamic_lookup" \
                     OTHER_CFLAGS="-w -Wno-everything -I$(pwd)/build_headers"

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/ 2>/dev/null || cp -r $(find build -name "*.app" | head -n 1) Payload/
          zip -r App.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-IPA
          path: App.ipa
