name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Headers & Patch Swift Source Files
        run: |
          INCLUDE_DIR="build_headers/sys"
          mkdir -p "$INCLUDE_DIR"
          
          # Patch header fileport.h
          echo '#ifndef FILEPORT_H' > "$INCLUDE_DIR/fileport.h"
          echo '#define FILEPORT_H' >> "$INCLUDE_DIR/fileport.h"
          echo '#include <sys/cdefs.h>' >> "$INCLUDE_DIR/fileport.h"
          echo '#include <mach/mach.h>' >> "$INCLUDE_DIR/fileport.h"
          echo 'typedef mach_port_t fileport_t;' >> "$INCLUDE_DIR/fileport.h"
          echo '#define FILEPORT_NULL MACH_PORT_NULL' >> "$INCLUDE_DIR/fileport.h"
          echo 'int fileport_makeport(int fd, fileport_t *port);' >> "$INCLUDE_DIR/fileport.h"
          echo 'int fileport_makefd(fileport_t port);' >> "$INCLUDE_DIR/fileport.h"
          echo '#endif' >> "$INCLUDE_DIR/fileport.h"

          # Patch các dòng gọi hàm bị lỗi trực tiếp trong file Swift
          find . -name "FileBrowserView.swift" -exec sed -i '' 's/MCMActivateContainer(.*)/nil/g' {} +
          find . -name "CleanerView.swift" -exec sed -i '' 's/MCMActivateContainerPath(.*)/nil/g' {} +
          find . -name "KernelExploit.swift" -exec sed -i '' 's/sandbox_access_is_active()/1/g' {} +
          find . -name "KernelExploit.swift" -exec sed -i '' 's/kexploit_opa334()/0/g' {} +
          find . -name "KernelExploit.swift" -exec sed -i '' 's/proc_self()/nil/g' {} +
          find . -name "KernelExploit.swift" -exec sed -i '' 's/sandbox_escape(.*)/0/g' {} +
          find . -name "WallpaperLabView.swift" -exec sed -i '' 's/openApplicationForBundleID(.*)/true/g' {} +

          # Bridging Header rỗng để tránh conflict
          HEADER_FILE=$(find . -name "*Bridging-Header.h" | head -n 1)
          if [ -n "$HEADER_FILE" ]; then
            echo "// Blank Bridging Header" > "$HEADER_FILE"
          fi

          # Tự động tạo thư mục lproj chuẩn
          for lang in en vi zh-Hans; do
            find . -type d -name "ThreeOneOSFive" | while read -r appdir; do
              mkdir -p "$appdir/${lang}.lproj"
            done
            mkdir -p "${lang}.lproj"
          done

          # Ghi file Localizable.strings vào TẤT CẢ thư mục .lproj
          find . -type d -name "*.lproj" | while read -r dir; do
            echo '/* Localizable */' > "$dir/Localizable.strings"
          done

          PROJ_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          ruby -r xcodeproj -e "
            proj = Xcodeproj::Project.open('$PROJ_FILE')
            proj.recreate_user_schemes
            proj.targets.each do |target|
              Xcodeproj::XCScheme.share_scheme(proj.path, target.name)
            end
            proj.save
          "

      - name: Build App
        run: |
          PROJ_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          SCHEME=$(xcodebuild -list -project "$PROJ_FILE" | awk '/Schemes:/{flag=1;next}/Build Configurations:/{flag=0}flag' | xargs | awk '{print $1}')

          rm -rf build/Build/Intermediates.noindex/PrecompiledHeaders

          xcodebuild -project "$PROJ_FILE" \
                     -scheme "$SCHEME" \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     GCC_WARN_INHIBIT_ALL_WARNINGS=YES \
                     GCC_PRECOMPILE_PREFIX_HEADER=NO \
                     CLANG_ENABLE_MODULE_DEBUGGING=NO \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     USER_HEADER_SEARCH_PATHS="$(pwd)/build_headers" \
                     HEADER_SEARCH_PATHS="$(pwd)/build_headers" \
                     OTHER_LDFLAGS="-Xlinker -undefined -Xlinker dynamic_lookup" \
                     OTHER_CFLAGS="-w -Wno-everything -I$(pwd)/build_headers"

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/ 2>/dev/null || cp -r $(find build -name "*.app" | head -n 1) Payload/
          zip -r App.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-IPA
          path: App.ipa
