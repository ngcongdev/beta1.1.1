name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Patch Missing Headers & Fix Strings
        run: |
          # Patch header sys/fileport.h bị thiếu
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          INCLUDE_DIR="build_headers/sys"
          mkdir -p "$INCLUDE_DIR"
          
          cat << 'EOF' > "$INCLUDE_DIR/fileport.h"
          #ifndef FILEPORT_H
          #define FILEPORT_H
          #include <sys/cdefs.h>
          #include <mach/mach.h>
          typedef mach_port_t fileport_t;
          #define FILEPORT_NULL MACH_PORT_NULL
          int fileport_makeport(int fd, fileport_t *port);
          int fileport_makefd(fileport_t port);
          #endif
          EOF
          # Fix file .strings
          find . -name "*.lproj" -type d | while read -r dir; do
            STR_FILE="$dir/Localizable.strings"
            printf "\xFF\xFE" > "$STR_FILE"
            echo '/* Empty */' | iconv -f UTF-8 -t UTF-16LE >> "$STR_FILE"
          done
          PROJ_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          ruby -r xcodeproj -e "
            proj = Xcodeproj::Project.open('$PROJ_FILE')
            proj.recreate_user_schemes
            proj.targets.each do |target|
              Xcodeproj::XCScheme.share_scheme(proj.path, target.name)
            end
            proj.save
          "
      - name: Build App
        run: |
          PROJ_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          SCHEME=$(xcodebuild -list -project "$PROJ_FILE" | awk '/Schemes:/{flag=1;next}/Build Configurations:/{flag=0}flag' | xargs | awk '{print $1}')
          xcodebuild -project "$PROJ_FILE" \
                     -scheme "$SCHEME" \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     GCC_WARN_INHIBIT_ALL_WARNINGS=YES \
                     USER_HEADER_SEARCH_PATHS="$(pwd)/build_headers" \
                     HEADER_SEARCH_PATHS="$(pwd)/build_headers" \
                     OTHER_CFLAGS="-w -Wno-everything -I$(pwd)/build_headers"
      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/ 2>/dev/null || cp -r $(find build -name "*.app" | head -n 1) Payload/
          zip -r App.ipa Payload
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-IPA
          path: App.ipa
