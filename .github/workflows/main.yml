name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Patch Missing Headers, Strings & Stubs
        run: |
          INCLUDE_DIR="build_headers/sys"
          mkdir -p "$INCLUDE_DIR"
          
          # Patch header fileport.h
          echo '#ifndef FILEPORT_H' > "$INCLUDE_DIR/fileport.h"
          echo '#define FILEPORT_H' >> "$INCLUDE_DIR/fileport.h"
          echo '#include <sys/cdefs.h>' >> "$INCLUDE_DIR/fileport.h"
          echo '#include <mach/mach.h>' >> "$INCLUDE_DIR/fileport.h"
          echo 'typedef mach_port_t fileport_t;' >> "$INCLUDE_DIR/fileport.h"
          echo '#define FILEPORT_NULL MACH_PORT_NULL' >> "$INCLUDE_DIR/fileport.h"
          echo 'int fileport_makeport(int fd, fileport_t *port);' >> "$INCLUDE_DIR/fileport.h"
          echo 'int fileport_makefd(fileport_t port);' >> "$INCLUDE_DIR/fileport.h"
          echo '#endif' >> "$INCLUDE_DIR/fileport.h"

          # Stub các symbol bị thiếu
          STUB_FILE="build_headers/stubs.c"
          echo '#include <stdbool.h>' > "$STUB_FILE"
          echo 'void early_kwrite32bytes(void) {}' >> "$STUB_FILE"
          echo 'void early_kwrite64(void) {}' >> "$STUB_FILE"
          echo 'bool kexploit_opa334(void) { return false; }' >> "$STUB_FILE"
          echo 'void rwSocketPcb(void) {}' >> "$STUB_FILE"
          echo 'void proc_self(void) {}' >> "$STUB_FILE"
          echo 'void sandbox_escape(void) {}' >> "$STUB_FILE"

          # Tạo file XML Plist chuẩn
          echo '<?xml version="1.0" encoding="UTF-8"?>' > base.plist
          echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> base.plist
          echo '<plist version="1.0"><dict>' >> base.plist
          echo '<key>COMMON.DEVICE</key><string>THIẾT BỊ</string>' >> base.plist
          echo '<key>dashboard.hardware_model</key><string>Mẫu máy</string>' >> base.plist
          echo '<key>settings.ios_version</key><string>Phiên bản iOS</string>' >> base.plist
          echo '<key>settings.compatibility</key><string>Tương thích</string>' >> base.plist
          echo '<key>settings.supported</key><string>Được hỗ trợ</string>' >> base.plist
          echo '<key>settings.supported_range_summary</key><string>Hỗ trợ iOS 15.0 - 16.7.10</string>' >> base.plist
          echo '<key>DASHBOARD.FEATURES</key><string>TÍNH NĂNG</string>' >> base.plist
          echo '<key>tab.cleaner</key><string>Dọn dẹp rác</string>' >> base.plist
          echo '<key>tab.wallpapers</key><string>Hình nền</string>' >> base.plist
          echo '<key>dashboard.features_footer</key><string>Các công cụ tối ưu hệ thống</string>' >> base.plist
          echo '<key>DASHBOARD.INSTALLATION</key><string>CÀI ĐẶT</string>' >> base.plist
          echo '<key>dashboard.enterprise_signing</key><string>Chứng chỉ doanh nghiệp</string>' >> base.plist
          echo '<key>tab.home</key><string>Trang chủ</string>' >> base.plist
          echo '<key>tab.files</key><string>Tệp tin</string>' >> base.plist
          echo '<key>tab.patches</key><string>Bản vá</string>' >> base.plist
          echo '</dict></plist>' >> base.plist

          # Convert sang OpenStep Format mà builtin-copyStrings bắt buộc nhận diện được
          plutil -convert xml1 base.plist -o clean.strings

          find . -name "*.strings" | while read -r file; do
            cp clean.strings "$file"
          done
          rm -f base.plist clean.strings

          PROJ_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          ruby -r xcodeproj -e "
            proj = Xcodeproj::Project.open('$PROJ_FILE')
            proj.recreate_user_schemes
            proj.targets.each do |target|
              Xcodeproj::XCScheme.share_scheme(proj.path, target.name)
            end
            proj.save
          "

      - name: Build App
        run: |
          PROJ_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          SCHEME=$(xcodebuild -list -project "$PROJ_FILE" | awk '/Schemes:/{flag=1;next}/Build Configurations:/{flag=0}flag' | xargs | awk '{print $1}')

          xcodebuild -project "$PROJ_FILE" \
                     -scheme "$SCHEME" \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     GCC_WARN_INHIBIT_ALL_WARNINGS=YES \
                     USER_HEADER_SEARCH_PATHS="$(pwd)/build_headers" \
                     HEADER_SEARCH_PATHS="$(pwd)/build_headers" \
                     OTHER_LDFLAGS="-Wl,-undefined,dynamic_lookup" \
                     OTHER_CFLAGS="-w -Wno-everything -I$(pwd)/build_headers $(pwd)/build_headers/stubs.c"

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/ 2>/dev/null || cp -r $(find build -name "*.app" | head -n 1) Payload/
          zip -r App.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-IPA
          path: App.ipa
