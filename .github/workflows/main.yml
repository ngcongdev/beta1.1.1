name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Patch Missing Headers, Strings & Stubs
        run: |
          INCLUDE_DIR="build_headers/sys"
          mkdir -p "$INCLUDE_DIR"
          
          # Patch header fileport.h
          echo '#ifndef FILEPORT_H' > "$INCLUDE_DIR/fileport.h"
          echo '#define FILEPORT_H' >> "$INCLUDE_DIR/fileport.h"
          echo '#include <sys/cdefs.h>' >> "$INCLUDE_DIR/fileport.h"
          echo '#include <mach/mach.h>' >> "$INCLUDE_DIR/fileport.h"
          echo 'typedef mach_port_t fileport_t;' >> "$INCLUDE_DIR/fileport.h"
          echo '#define FILEPORT_NULL MACH_PORT_NULL' >> "$INCLUDE_DIR/fileport.h"
          echo 'int fileport_makeport(int fd, fileport_t *port);' >> "$INCLUDE_DIR/fileport.h"
          echo 'int fileport_makefd(fileport_t port);' >> "$INCLUDE_DIR/fileport.h"
          echo '#endif' >> "$INCLUDE_DIR/fileport.h"

          # Stub các symbol bị thiếu để qua mặt Linker (ld)
          STUB_FILE="build_headers/stubs.c"
          echo '#include <stdbool.h>' > "$STUB_FILE"
          echo 'void early_kwrite32bytes(void) {}' >> "$STUB_FILE"
          echo 'void early_kwrite64(void) {}' >> "$STUB_FILE"
          echo 'bool kexploit_opa334(void) { return false; }' >> "$STUB_FILE"
          echo 'void rwSocketPcb(void) {}' >> "$STUB_FILE"
          echo 'void proc_self(void) {}' >> "$STUB_FILE"
          echo 'void sandbox_escape(void) {}' >> "$STUB_FILE"

          # Tạo file JSON không dùng heredoc EOF để tránh lỗi YAML Indentation
          echo '{"COMMON.DEVICE":"THIẾT BỊ","dashboard.hardware_model":"Mẫu máy","settings.ios_version":"Phiên bản iOS","settings.compatibility":"Tương thích","settings.supported":"Được hỗ trợ","settings.supported_range_summary":"Hỗ trợ iOS 15.0 - 16.7.10","DASHBOARD.FEATURES":"TÍNH NĂNG","tab.cleaner":"Dọn dẹp rác","tab.wallpapers":"Hình nền","dashboard.features_footer":"Các công cụ tối ưu hệ thống","DASHBOARD.INSTALLATION":"CÀI ĐẶT","dashboard.enterprise_signing":"Chứng chỉ doanh nghiệp","tab.home":"Trang chủ","tab.files":"Tệp tin","tab.patches":"Bản vá"}' > translations.json

          find . -name "*.strings" | while read -r file; do
            plutil -convert binary1 translations.json -o "$file"
          done
          rm -f translations.json

          PROJ_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          ruby -r xcodeproj -e "
            proj = Xcodeproj::Project.open('$PROJ_FILE')
            proj.recreate_user_schemes
            proj.targets.each do |target|
              Xcodeproj::XCScheme.share_scheme(proj.path, target.name)
            end
            proj.save
          "

      - name: Build App
        run: |
          PROJ_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          SCHEME=$(xcodebuild -list -project "$PROJ_FILE" | awk '/Schemes:/{flag=1;next}/Build Configurations:/{flag=0}flag' | xargs | awk '{print $1}')

          xcodebuild -project "$PROJ_FILE" \
                     -scheme "$SCHEME" \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     GCC_WARN_INHIBIT_ALL_WARNINGS=YES \
                     USER_HEADER_SEARCH_PATHS="$(pwd)/build_headers" \
                     HEADER_SEARCH_PATHS="$(pwd)/build_headers" \
                     OTHER_LDFLAGS="-Wl,-undefined,dynamic_lookup" \
                     OTHER_CFLAGS="-w -Wno-everything -I$(pwd)/build_headers $(pwd)/build_headers/stubs.c"

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/ 2>/dev/null || cp -r $(find build -name "*.app" | head -n 1) Payload/
          zip -r App.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-IPA
          path: App.ipa
