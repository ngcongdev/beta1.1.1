name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Patch Headers, Stubs & Fix Localization Complete
        run: |
          INCLUDE_DIR="build_headers/sys"
          mkdir -p "$INCLUDE_DIR"
          
          # Patch header fileport.h
          echo '#ifndef FILEPORT_H' > "$INCLUDE_DIR/fileport.h"
          echo '#define FILEPORT_H' >> "$INCLUDE_DIR/fileport.h"
          echo '#include <sys/cdefs.h>' >> "$INCLUDE_DIR/fileport.h"
          echo '#include <mach/mach.h>' >> "$INCLUDE_DIR/fileport.h"
          echo 'typedef mach_port_t fileport_t;' >> "$INCLUDE_DIR/fileport.h"
          echo '#define FILEPORT_NULL MACH_PORT_NULL' >> "$INCLUDE_DIR/fileport.h"
          echo 'int fileport_makeport(int fd, fileport_t *port);' >> "$INCLUDE_DIR/fileport.h"
          echo 'int fileport_makefd(fileport_t port);' >> "$INCLUDE_DIR/fileport.h"
          echo '#endif' >> "$INCLUDE_DIR/fileport.h"

          # Tự động tạo thư mục và file ngôn ngữ rỗng nếu thiếu
          for lang in en vi zh-Hans; do
            mkdir -p "ThreeOneOSFive/${lang}.lproj"
            if [ ! -f "ThreeOneOSFive/${lang}.lproj/Localizable.strings" ]; then
              echo '/* Localizable Strings */' > "ThreeOneOSFive/${lang}.lproj/Localizable.strings"
            fi
          done

          # Cập nhật hoàn chỉnh Localization.swift
          python3 -c '
          import os
          path = "ThreeOneOSFive/helpers/Localization.swift"
          swift_code = """import SwiftUI

          enum AppLanguage: String, CaseIterable, Identifiable, Hashable {
              case english = "en"
              case vietnamese = "vi"
              case simplifiedChinese = "zh-Hans"

              var id: String { rawValue }

              var languageCode: String {
                  switch self {
                  case .english:
                      return "en"
                  case .vietnamese:
                      return "vi"
                  case .simplifiedChinese:
                      return "zh-Hans"
                  }
              }

              var displayName: String {
                  switch self {
                  case .english:
                      return "English"
                  case .vietnamese:
                      return "Tiếng Việt"
                  case .simplifiedChinese:
                      return "简体中文"
                  }
              }

              func text(_ key: String, _ args: CVarArg...) -> String {
                  let format: String
                  if let path = Bundle.main.path(forResource: languageCode, ofType: "lproj"),
                     let bundle = Bundle(path: path) {
                      format = NSLocalizedString(key, bundle: bundle, comment: "")
                  } else {
                      format = NSLocalizedString(key, comment: "")
                  }
                  if args.isEmpty {
                      return format
                  }
                  return String(format: format, arguments: args)
              }
          }

          private struct AppLanguageKey: EnvironmentKey {
              static let defaultValue: AppLanguage = .english
          }

          extension EnvironmentValues {
              var appLanguage: AppLanguage {
                  get { self[AppLanguageKey.self] }
                  set { self[AppLanguageKey.self] = newValue }
              }
          }
          """
          with open(path, "w") as f:
              f.write(swift_code)
          '

          PROJ_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          ruby -r xcodeproj -e "
            proj = Xcodeproj::Project.open('$PROJ_FILE')
            proj.recreate_user_schemes
            proj.targets.each do |target|
              Xcodeproj::XCScheme.share_scheme(proj.path, target.name)
            end
            proj.save
          "

      - name: Build App
        run: |
          PROJ_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          SCHEME=$(xcodebuild -list -project "$PROJ_FILE" | awk '/Schemes:/{flag=1;next}/Build Configurations:/{flag=0}flag' | xargs | awk '{print $1}')

          xcodebuild -project "$PROJ_FILE" \
                     -scheme "$SCHEME" \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     GCC_WARN_INHIBIT_ALL_WARNINGS=YES \
                     GCC_PRECOMPILE_PREFIX_HEADER=NO \
                     USER_HEADER_SEARCH_PATHS="$(pwd)/build_headers" \
                     HEADER_SEARCH_PATHS="$(pwd)/build_headers" \
                     OTHER_LDFLAGS="-Xlinker -undefined -Xlinker dynamic_lookup" \
                     OTHER_CFLAGS="-w -Wno-everything -I$(pwd)/build_headers"

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/ 2>/dev/null || cp -r $(find build -name "*.app" | head -n 1) Payload/
          zip -r App.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-IPA
          path: App.ipa
